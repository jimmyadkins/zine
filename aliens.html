<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Extraterrestrial Watchlist</title>
  <style>
    body {
      background-color: black;
      color: lime;
      font-family: "Courier New", monospace;
      text-align: center;
      background-image: url("images/stars.gif");
      background-size: cover;
      padding: 20px;
    }

    h1 {
      color: cyan;
      font-size: 36px;
      text-shadow: 2px 2px black;
      margin-bottom: 10px;
    }

    .caption {
      color: magenta;
      font-size: 18px;
      margin: 10px 0;
    }

    img {
      max-width: 90%;
      height: auto;
      margin: 20px auto;
      display: block;
      border: 2px solid #00ffcc;
      background-color: black;
      padding: 5px;
    }

    a img:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .footer {
      font-size: 12px;
      color: gray;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <h1>
    <img src="images/ufoflash.gif" style="height: 36px; vertical-align: middle;" alt="UFO Icon">
    Extraterrestrial Watchlist
    <img src="images/ufoflash.gif" style="height: 36px; vertical-align: middle;" alt="UFO Icon">
  </h1>

  <div class="caption">They’re not coming. They’re already here.</div>

  <img src="images/ufo-flight.gif" width="600" alt="UFO Footage">
  <div class="caption">Declassified footage</div>

  <img src="images/crop-circles.jpg" width="600" alt="Crop Circles">
  <div class="caption">Messages in the Fields</div>

  <img src="images/alien-experiment.gif" width="600" alt="Area 51 security footage">
  <div class="caption">Area 51 Experiments</div>

  <img src="images/abduction.gif" width="600" alt="Abduction beam">
  <div class="caption">They took the cows...</div>

  <img src="images/yankee-hat-alien.gif" width="600" alt="Alien coming to get ya">
  <div class="caption">Do not answer the voices. They’re not in your head.</div>

  <a href="index.html">
    <img src="images/end-transmission.gif" alt="Return to safety">
  </a>
  <div class="footer">Click to return to base</div>

</body>
</html>
